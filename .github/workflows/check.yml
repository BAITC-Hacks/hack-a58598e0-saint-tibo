name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - run: bun run setup
      - run: bun run verify
      - run: bun run test:integration
      - name: Check generated contract and client
        run: |
          bun run api:generate
          test -z "$(git status --porcelain -- contracts/openapi.json frontend/src/shared/api/generated)"
      - name: Build and start application containers
        run: docker compose --profile app up -d --build --wait
      - name: Check running application
        run: |
          curl --fail --silent http://localhost:8000/health/ready
          curl --fail --silent http://localhost:3000/login | grep -q 'Saint Tibo'
      - if: always()
        run: docker compose --profile app down -v
