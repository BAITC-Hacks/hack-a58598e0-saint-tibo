name: saint-honcho
services:
  api:
    image: ${HONCHO_IMAGE:-ghcr.io/plastic-labs/honcho:v3.2.0}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HONCHO_PORT:-18000}:8000"
    env_file:
      - path: .env
        required: true
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@database:5432/honcho
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      AUTH_USE_AUTH: "true"
      AUTH_JWT_SECRET: ${HONCHO_JWT_SECRET:?set HONCHO_JWT_SECRET}
      TELEMETRY_ENABLED: "false"
      TELEMETRY_TRACE_PAYLOADS_ENABLED: "false"
      DERIVER_MODEL_CONFIG__MODEL: ${DERIVER_MODEL_CONFIG__MODEL:-local-chat-model}
      DERIVER_MODEL_CONFIG__TRANSPORT: openai
      DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      DERIVER_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      SUMMARY_MODEL_CONFIG__MODEL: ${SUMMARY_MODEL_CONFIG__MODEL:-local-chat-model}
      SUMMARY_MODEL_CONFIG__TRANSPORT: openai
      SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      SUMMARY_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      EMBEDDING_MODEL_CONFIG__MODEL: ${EMBEDDING_MODEL_CONFIG__MODEL:-local-embedding-model}
      EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_EMBEDDING_BASE_URL:?set LOCAL_EMBEDDING_BASE_URL}
      EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL: ${DIALECTIC_LEVELS__minimal__MODEL_CONFIG__MODEL:-local-chat-model}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      DIALECTIC_LEVELS__minimal__MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL: ${DIALECTIC_LEVELS__low__MODEL_CONFIG__MODEL:-local-chat-model}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__TRANSPORT: openai
      DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      DIALECTIC_LEVELS__low__MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      DREAM_DEDUCTION_MODEL_CONFIG__MODEL: ${DREAM_DEDUCTION_MODEL_CONFIG__MODEL:-local-chat-model}
      DREAM_DEDUCTION_MODEL_CONFIG__TRANSPORT: openai
      DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      DREAM_DEDUCTION_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      DREAM_INDUCTION_MODEL_CONFIG__MODEL: ${DREAM_INDUCTION_MODEL_CONFIG__MODEL:-local-chat-model}
      DREAM_INDUCTION_MODEL_CONFIG__TRANSPORT: openai
      DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      DREAM_INDUCTION_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      LLM_OPENAI_API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      LLM_GEMINI_API_KEY: ""
      LLM_ANTHROPIC_API_KEY: ""
      LLM_GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    restart: unless-stopped
    networks: [honcho]
  deriver:
    image: ${HONCHO_IMAGE:-ghcr.io/plastic-labs/honcho:v3.2.0}
    command: ["/app/.venv/bin/python", "-m", "src.deriver"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      DB_CONNECTION_URI: postgresql+psycopg://honcho:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@database:5432/honcho
      CACHE_URL: redis://redis:6379/0?suppress=true
      CACHE_ENABLED: "true"
      TELEMETRY_ENABLED: "false"
      TELEMETRY_TRACE_PAYLOADS_ENABLED: "false"
      DERIVER_MODEL_CONFIG__MODEL: ${DERIVER_MODEL_CONFIG__MODEL:-local-chat-model}
      DERIVER_MODEL_CONFIG__TRANSPORT: openai
      DERIVER_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      DERIVER_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      SUMMARY_MODEL_CONFIG__MODEL: ${SUMMARY_MODEL_CONFIG__MODEL:-local-chat-model}
      SUMMARY_MODEL_CONFIG__TRANSPORT: openai
      SUMMARY_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_LLM_BASE_URL:?set LOCAL_LLM_BASE_URL}
      SUMMARY_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      EMBEDDING_MODEL_CONFIG__MODEL: ${EMBEDDING_MODEL_CONFIG__MODEL:-local-embedding-model}
      EMBEDDING_MODEL_CONFIG__TRANSPORT: openai
      EMBEDDING_MODEL_CONFIG__OVERRIDES__BASE_URL: ${LOCAL_EMBEDDING_BASE_URL:?set LOCAL_EMBEDDING_BASE_URL}
      EMBEDDING_MODEL_CONFIG__OVERRIDES__API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      LLM_OPENAI_API_KEY: ${LOCAL_LLM_API_KEY:?set LOCAL_LLM_API_KEY}
      LLM_GEMINI_API_KEY: ""
      LLM_ANTHROPIC_API_KEY: ""
      LLM_GROQ_API_KEY: ""
      OPENAI_API_KEY: ""
    restart: unless-stopped
    networks: [honcho]
  database:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: honcho
      POSTGRES_USER: honcho
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - honcho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honcho -d honcho"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [honcho]
  redis:
    image: redis:8.2
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [honcho]
networks:
  honcho:
    internal: true
volumes:
  honcho_pgdata:
